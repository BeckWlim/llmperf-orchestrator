[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "LLMPerf"
version = "1.0.0"
description = "A framework for load testing LLM APIs"
authors = [{name="Avnish Narayan", email="avnish@anyscale.com"}]
license = {text= "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5,<2.6",
    "fastapi>=0.103,<0.110",
    "uvicorn>=0.23,<0.28",
    "PyYAML>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "SQLAlchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.28,<0.31",
    "PyJWT[crypto]>=2.8,<3",
    "ray[default]>=2.51,<2.52",
    "pandas",
    "requests",
    "httpx>=0.27,<1",
    "transformers==5.14.1",
    "huggingface-hub>=1.5,<2",
    "tqdm",
]

[project.optional-dependencies]
litellm = ["litellm==1.83.0"]
sagemaker = ["boto3==1.43.74"]
correctness = ["num2words==0.5.14"]
dev = [
    "basedpyright==1.39.10",
    "black==25.1.0",
    "boto3==1.43.74",
    "litellm==1.83.0",
    "num2words==0.5.14",
    "pytest==9.1.1",
]

[project.scripts]
llmperf-backend = "llmperf_backend.__main__:main"
llmperfctl = "llmperf_cli.__main__:main"
llmperf-cache-links = "llmperf_tools.huggingface_cache_links:main"

[tool.setuptools.package-data]
llmperf = ["sonnet.txt"]
llmperf_backend = ["configs/*.yaml"]

[tool.basedpyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.10"
pythonPlatform = "Linux"
typeCheckingMode = "standard"

[tool.black]
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
test_name_max_underscores = "3"
postgresql_url_env = "LLMPERF_TEST_DB"
markers = [
    "postgresql: tests requiring an explicitly configured disposable PostgreSQL database",
]
