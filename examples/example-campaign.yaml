# Main role: compare two immediate load points inside one durable Campaign.
# Budget: 2 serial + 2 concurrent requests = 4 requests.
# Setup: replace every provider/model pair with your configured target.
# Run: llmperfctl campaign start -f examples/example-campaign.yaml --wait
# Observe: compare the labeled Runners' latency/errors; both share Scheduler capacity.
# Two requests per point demonstrate configuration, not statistically reliable performance.
version: 1.0.0
campaign:
  name: example-campaign
  description: Compare serial and concurrent request execution with the same input shape.
  tags:
    provider: aliyun
    model: deepseek-v4-pro
wait: true
# These Runners are independently eligible; list order is not a sequence barrier.
runners:
- label: example-serial
  metadata:
    purpose: serial-baseline
  provider: aliyun
  model: deepseek-v4-pro
  timeout: 60
  concurrent_workers: 1 # Serial baseline within this Runner.
  mean_output_tokens: 16
  stddev_output_tokens: 0
  additional_sampling_params:
    temperature: 0
  inputs:
    default:
      tokens: 128
  worker:
    repeat: 2
- label: example-parallel
  metadata:
    purpose: parallel-comparison
  provider: aliyun
  model: deepseek-v4-pro
  timeout: 60
  concurrent_workers: 2 # Allow both requests to overlap if shared capacity is free.
  mean_output_tokens: 16
  stddev_output_tokens: 0
  additional_sampling_params:
    temperature: 0
  inputs:
    default:
      tokens: 128
  worker:
    repeat: 2
