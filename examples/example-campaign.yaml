version: 1.0.0
campaign:
  name: example-campaign
  description: Combine immediate benchmarks with one compiled replay task.
  tags:
    provider: aliyun
    model: deepseek-v4-pro
wait: true
runners:
- label: example-serial
  metadata:
    purpose: serial-baseline
  provider: aliyun
  model: deepseek-v4-pro
  timeout: 60
  concurrent_requests: 1
  mean_output_tokens: 16
  stddev_output_tokens: 0
  additional_sampling_params:
    temperature: 0
  inputs:
    default:
      tokens: 128
  request:
    repeat: 2
- label: example-parallel
  metadata:
    purpose: parallel-comparison
  provider: aliyun
  model: deepseek-v4-pro
  timeout: 60
  concurrent_requests: 2
  mean_output_tokens: 16
  stddev_output_tokens: 0
  additional_sampling_params:
    temperature: 0
  inputs:
    default:
      tokens: 128
  request:
    repeat: 2
task_definitions:
- name: example-replay-task
  instances:
    trials: 1
    seed: 11111
  payloads:
    replay:
      seed: replay
  workflow:
  - invoke:
      name: prime
      payload: replay
  - invoke:
      name: warm
      payload: replay
      after:
        value: 500
        unit: ms
  runner:
    label: example-replay-task
    metadata:
      purpose: deterministic-replay
    provider: aliyun
    model: deepseek-v4-pro
    tokenizer:
      id: deepseek-ai/DeepSeek-V3
      revision: main
      use_fast: true
    timeout: 60
    concurrent_requests: 1
    mean_output_tokens: 16
    stddev_output_tokens: 0
    additional_sampling_params:
      temperature: 0
    inputs:
      default:
        tokens: 128
    request: {}
