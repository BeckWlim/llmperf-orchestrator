version: 1.0.0
wait: true
campaign:
  name: stable-family-recall
  description: Three fixed prefixes, two independent trials, changing suffixes.
task_definitions:
- name: families
  instances:
    matrix:
      family: [0, 1, 2]
    trials: 2
    seed: 20261020
    prefix_seed_scope: family
  workflow:
  - run:
      name: batch
  runner:
    provider: dfs-chat
    model: spark-x2.5-1.7b-L4
    tokenizer:
      id: hf-internal-testing/llama-tokenizer
      revision: d02ad6cb9dd2c2296a6332199fa2fdca5938fef0
      use_fast: true
    timeout: 60
    concurrent_requests: 2
    mean_output_tokens: 8
    stddev_output_tokens: 0
    inputs:
      default:
        tokens: 128
        shared_prefix_tokens: 96
    request:
      repeat: 4
