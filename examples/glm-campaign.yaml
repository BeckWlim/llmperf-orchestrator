campaign:
  name: glm-concurrency-study
  description: Compare GLM throughput at multiple concurrency levels.
  tags:
    purpose: performance-study

wait: true

runners:
  - label: concurrency-1
    metadata:
      concurrency: 1
    benchmark:
      provider: aliyun
      model: glm-5.2
      tokenizer:
        id: THUDM/glm-4-9b-chat
        revision: main
        use_fast: true
      timeout_seconds: 60
      max_completed_requests: 10
      concurrent_requests: 1
      mean_input_tokens: 128
      stddev_input_tokens: 0
      mean_output_tokens: 32
      stddev_output_tokens: 0
      additional_sampling_params:
        temperature: 0

  - label: concurrency-4
    metadata:
      concurrency: 4
    benchmark:
      provider: aliyun
      model: glm-5.2
      tokenizer:
        id: THUDM/glm-4-9b-chat
        revision: main
        use_fast: true
      timeout_seconds: 60
      max_completed_requests: 40
      concurrent_requests: 4
      mean_input_tokens: 128
      stddev_input_tokens: 0
      mean_output_tokens: 32
      stddev_output_tokens: 0
      additional_sampling_params:
        temperature: 0
