version: 1.0.0
wait: true
campaign:
  name: sequential-family-batches
  description: Two families advance independently through two four-request batches.
task_definitions:
- name: families
  instances:
    matrix:
      family:
      - 1
      - 2
    trials: 1
    seed: 20261014174544
  workflow:
  - repeat:
      name: rounds
      count: 2
      node:
        run:
          name: batch
  runner:
    label: family
    provider: dfs-chat
    model: spark-x2.5-1.7b-L4
    tokenizer:
      id: hf-internal-testing/llama-tokenizer
      revision: d02ad6cb9dd2c2296a6332199fa2fdca5938fef0
      use_fast: true
    timeout: 60
    concurrent_requests: 2
    mean_output_tokens: 8
    stddev_output_tokens: 0
    output_token_count: provider
    additional_sampling_params:
      temperature: 0
    inputs:
      default:
        shared_prefix_tokens: 96
        tokens: 128
    request:
      repeat: 4
