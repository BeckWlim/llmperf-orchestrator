version: "1.0.0"

campaign:
  name: example-task-promotion
  description: Repeated deterministic hits followed by a bounded quiet probe.
  tags:
    experiment: task-promotion

wait: true

task_definitions:
  - name: repeated-hit-surface
    instances:
      matrix:
        warmup_count: [0, 2]
        quiet_seconds: [1, 2]
      trials: 1
      seed: 33333
    payloads:
      replay: {seed_namespace: replay}
      cold: {seed_namespace: cold-control}
    workflow:
      - invoke:
          name: prime
          payload: replay
      - repeat:
          name: warmups
          count: $warmup_count
          every_seconds: 0
          node:
            invoke:
              name: warmup
              payload: replay
      - parallel:
          name: observation
          after_seconds: $quiet_seconds
          branches:
            - invoke:
                name: probe
                payload: replay
            - invoke:
                name: cold
                role: cold_control
                payload: cold
    runner:
      label: repeated-hit-surface
      metadata: {purpose: repeated-cache-hit}
      benchmark:
        provider: aliyun
        model: deepseek-v4-pro
        tokenizer: {id: deepseek-ai/DeepSeek-V3, revision: main, use_fast: true}
        timeout_seconds: 60
        concurrent_requests: 1
        mean_input_tokens: 2048
        stddev_input_tokens: 0
        mean_output_tokens: 8
        stddev_output_tokens: 0
        additional_sampling_params:
          temperature: 0
          stream_options: {include_usage: true}
