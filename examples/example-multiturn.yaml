version: 1.0.0
wait: true
campaign:
  name: multi-turn-smoke
runners:
- label: conversation
  provider: aliyun
  model: deepseek-v4-pro
  tokenizer:
    id: deepseek-ai/DeepSeek-V3
  timeout: 60
  mean_output_tokens: 16
  stddev_output_tokens: 0
  output_token_count: provider
  additional_sampling_params:
    temperature: 0
  inputs:
    opening:
      text: Remember the word ORCHID. Reply with a brief acknowledgement.
    followup:
      text: What word did I ask you to remember?
  request:
    steps:
    - name: opening
      input: opening
    - name: followup
      depends_on:
      - step: opening
        reuse_messages: true
      after:
        value: 500
        unit: ms
      input: followup
