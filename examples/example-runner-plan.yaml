version: 1.0.0
campaign:
  name: example-runner-plan
  description: Materialize two small Runners one second apart.
  tags:
    provider: aliyun
    workload: runner-plan
wait: true
runner_plans:
- name: example-runner-plan
  timezone: Asia/Shanghai
  max_occurrences: 2
  recurrence:
    kind: interval
    every: 1
  overlap_policy: queue
  misfire_grace_seconds: 60
  runner:
    label: example-planned-runner
    metadata:
      purpose: bounded-plan
    provider: aliyun
    model: deepseek-v4-pro
    timeout: 60
    concurrent_workers: 1
    mean_output_tokens: 16
    stddev_output_tokens: 0
    additional_sampling_params:
      temperature: 0
    inputs:
      default:
        tokens: 64
    worker: {}
