# ShareGPT cold-versus-repeated implicit KV-cache test for an Aliyun
# OpenAI-compatible deepseek-v4-pro endpoint. The Scheduler downloads and caches
# the declared Hugging Face dataset after the Runners have been queued.
campaign:
  name: deepseek-v4-pro-kvcache-reality
  description: Measure implicit KV-cache hit ratio with standard ShareGPT prompts.
  tags:
    purpose: kv-cache-reality-test
    provider: aliyun
    model: deepseek-v4-pro

wait: true

runners:
  - label: sharegpt-unique-control
    metadata:
      cache_scenario: sharegpt-unique-control
      expected_cache_hit_ratio: near-zero
    benchmark:
      provider: aliyun
      model: deepseek-v4-pro
      timeout_seconds: 180
      max_completed_requests: 8
      concurrent_requests: 1
      mean_input_tokens: 3072
      stddev_input_tokens: 2048
      dataset:
        source: huggingface
        id: anon8231489123/ShareGPT_Vicuna_unfiltered
        filename: ShareGPT_V3_unfiltered_cleaned_split.json
        revision: main
        format: sharegpt
      dataset_repeat_count: 1
      dataset_seed: 11111
      mean_output_tokens: 32
      stddev_output_tokens: 0
      additional_sampling_params:
        temperature: 0
        stream_options:
          include_usage: true

  - label: sharegpt-repeated-prompts-serial
    metadata:
      cache_scenario: sharegpt-repeated-prompts
      expected_behavior: first occurrence primes each prompt and repetitions hit
      expected_aggregate_hit_ratio: approximately-0.75
    benchmark:
      provider: aliyun
      model: deepseek-v4-pro
      timeout_seconds: 240
      max_completed_requests: 8
      concurrent_requests: 1
      mean_input_tokens: 3072
      stddev_input_tokens: 2048
      dataset:
        source: huggingface
        id: anon8231489123/ShareGPT_Vicuna_unfiltered
        filename: ShareGPT_V3_unfiltered_cleaned_split.json
        revision: main
        format: sharegpt
      dataset_repeat_count: 4
      dataset_seed: 22222
      mean_output_tokens: 32
      stddev_output_tokens: 0
      additional_sampling_params:
        temperature: 0
        stream_options:
          include_usage: true
