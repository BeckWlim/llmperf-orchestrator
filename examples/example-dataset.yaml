version: 1.0.0
campaign:
  name: example-dataset
  description: Pinned ShareGPT dataset with Prime/Warm replay and a cold control.
  tags:
    experiment: dataset-replay
wait: true
task_definitions:
- name: dataset-replay
  instances:
    trials: 1
    seed: 20260819
  payloads:
    replay:
      seed: replay
    cold:
      seed: cold-control
  workflow:
  - invoke:
      name: prime
      payload: replay
  - parallel:
      name: observation
      branches:
      - invoke:
          name: warm
          payload: replay
      - invoke:
          name: cold
          role: cold_control
          payload: cold
  runner:
    label: dataset-replay
    metadata:
      purpose: dataset-replay
    provider: aliyun
    model: deepseek-v4-pro
    tokenizer:
      id: deepseek-ai/DeepSeek-V3
      revision: main
      use_fast: true
    timeout: 60
    concurrent_workers: 1
    mean_output_tokens: 8
    stddev_output_tokens: 0
    additional_sampling_params:
      temperature: 0
      stream_options:
        include_usage: true
    inputs:
      default:
        dataset:
          source: huggingface
          id: learnanything/sharegpt_v3_unfiltered_cleaned_split
          filename: ShareGPT_V3_unfiltered_cleaned_split.json
          revision: ddc6e27875b7198a46702daec3e61a55e222fc14
          adapter: sharegpt-user
        dataset_prompt_mode: concatenate
        dataset_repeat_count: 1
        tokens: 2048
    worker: {}
