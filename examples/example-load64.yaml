# Requires Backend actor concurrency 8, 8 Ray CPUs, 1 CPU per actor,
# and both performance guard concurrency limits set to at least 64.
# Verify the Provider with example-smoke.yaml before running this load point.
version: "1.0.0"
label: example-load64
benchmark:
  provider: aliyun
  model: deepseek-v4-pro
  timeout_seconds: 120
  max_completed_requests: 128
  concurrent_requests: 64
  mean_input_tokens: 64
  stddev_input_tokens: 0
  mean_output_tokens: 16
  stddev_output_tokens: 0
  additional_sampling_params:
    temperature: 0
