version: "1.0.0"

campaign:
  name: example-task-retention
  description: Independent Prime/Warm replay families across a delay matrix.
  tags:
    experiment: task-retention

wait: true

task_definitions:
  - name: retention-surface
    instances:
      matrix:
        delay_seconds: [0, 1]
      trials: 1
      seed: 11111
    payloads:
      replay: {seed_namespace: replay}
      cold: {seed_namespace: cold-control}
    workflow:
      - invoke:
          name: prime
          payload: replay
      - parallel:
          name: observation
          after_seconds: $delay_seconds
          branches:
            - invoke:
                name: warm
                payload: replay
            - invoke:
                name: cold
                role: cold_control
                payload: cold
    runner:
      label: retention-surface
      metadata: {purpose: cache-retention}
      benchmark:
        provider: aliyun
        model: deepseek-v4-pro
        tokenizer: {id: deepseek-ai/DeepSeek-V3, revision: main, use_fast: true}
        timeout_seconds: 60
        concurrent_requests: 1
        mean_input_tokens: 2048
        stddev_input_tokens: 0
        mean_output_tokens: 8
        stddev_output_tokens: 0
        additional_sampling_params:
          temperature: 0
          stream_options: {include_usage: true}
