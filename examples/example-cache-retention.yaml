campaign:
  name: example-cache-retention
  description: Exercise a short Prime/Warm retention sweep with cold controls.
  tags:
    provider: aliyun
    model: deepseek-v4-pro
    experiment: cache-retention

wait: true

protocol_definitions:
  - name: example-cache-retention
    protocol: cache-retention/v1
    delay_seconds: [0, 1]
    trials_per_delay: 1
    seed: 11111
    assignment: randomized_blocks
    refresh_semantics: independent_family
    cold_control: true
    runner:
      label: example-cache-retention
      metadata:
        purpose: cache-retention
      benchmark:
        provider: aliyun
        model: deepseek-v4-pro
        llm_api: openai
        tokenizer:
          id: deepseek-ai/DeepSeek-V3
          revision: main
          use_fast: true
        timeout_seconds: 60
        concurrent_requests: 1
        mean_input_tokens: 2048
        stddev_input_tokens: 0
        mean_output_tokens: 8
        stddev_output_tokens: 0
        additional_sampling_params:
          temperature: 0
          stream_options:
            include_usage: true

# Replace delay_seconds and trials_per_delay for a statistically useful TTL curve.
