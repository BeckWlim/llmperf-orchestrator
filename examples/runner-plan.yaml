campaign:
  name: deepseek-v4-pro-cache-campaign
  description: 以 30 秒间隔派发 8 轮 KV Cache 基准测试
  tags:
    provider: aliyun
    workload: kv-cache
runner_plans:
  - name: deepseek-v4-pro-cache-30s-8x
    timezone: Asia/Shanghai
    max_occurrences: 8
    recurrence:
      kind: interval
      every_seconds: 30
    overlap_policy: queue
    misfire_grace_seconds: 300
    runner:
      label: deepseek-v4-pro-cache-30s
      metadata:
        experiment: geographic-cache
      benchmark:
        provider: aliyun
        model: deepseek-v4-pro
        tokenizer:
          id: deepseek-ai/DeepSeek-V3
          revision: main
          use_fast: true
        concurrent_requests: 1
        mean_input_tokens: 4096
        stddev_input_tokens: 0
        mean_output_tokens: 16
        stddev_output_tokens: 0
        cache_probe:
          mode: exact_repeat
          trials: 20
