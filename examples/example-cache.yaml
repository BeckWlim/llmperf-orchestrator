# Main role: compare quiet retention with retention after repeated cache accesses.
# Budget: 4 matrix points; (prime + 0 or 2 warmups + probe + cold) totals 16 requests.
# Setup: replace provider/model and choose a compatible tokenizer for your target.
# Run: llmperfctl campaign start -f examples/example-cache.yaml --wait
# Observe: compare probe/cold latency and available counters at the same quiet interval.
# Missing counters mean unknown cache use; a short demonstration cannot establish TTL.
version: 1.0.0
campaign:
  name: example-cache-replay
  description: Compare replay after zero or two warmups and a short quiet interval.
  tags:
    experiment: cache-replay
wait: true
task_definitions:
- name: repeated-hit-surface
  instances:
    # Each matrix point has its own payload family, so one delay cannot warm another.
    matrix:
      warmup_count:
      # Zero measures a quiet interval after prime; two adds access before the interval.
      - 0
      - 2
      quiet_seconds:
      - 1
      - 2
    trials: 1
    seed: 33333
  payloads:
    # Prime, warmup, and probe reuse replay; cold uses a separate seed namespace.
    replay:
      seed: replay
    cold:
      seed: cold-control
  workflow:
  # Top-level entries form a success-dependent sequence of single-request Runners.
  - invoke:
      name: prime
      payload: replay
  - repeat:
      # Count zero skips this block; positive counts serialize warmup accesses.
      name: warmups
      count: $warmup_count
      every: 0
      node:
        invoke:
          name: warmup
          payload: replay
  - parallel:
      # Both observations become eligible after the same completion-relative quiet gap.
      name: observation
      after:
        value: $quiet_seconds
        unit: s
      branches:
      - invoke:
          name: probe
          payload: replay
      - invoke:
          name: cold
          role: cold_control # Analysis tag only; it does not force a Provider cache miss.
          payload: cold
  runner:
    label: repeated-hit-surface
    metadata:
      purpose: cache-replay
    provider: aliyun
    model: deepseek-v4-pro
    tokenizer:
      id: deepseek-ai/DeepSeek-V3
      revision: main
      use_fast: true
    timeout: 60
    concurrent_workers: 1 # Per atomic Runner; parallel branches may still overlap.
    mean_output_tokens: 8
    stddev_output_tokens: 0
    additional_sampling_params:
      temperature: 0
      stream_options:
        include_usage: true
    inputs:
      default:
        tokens: 2048
    worker: {}
