version: "1.0.0"

campaign:
  name: example-task-residency
  description: One payload replayed repeatedly at a fixed observation interval.
  tags:
    experiment: task-residency

wait: true

task_definitions:
  - name: residency-chain
    instances:
      matrix:
        observation_count: [2]
        interval_seconds: [1]
      trials: 1
      seed: 22222
    payloads:
      replay: {seed_namespace: replay}
    workflow:
      - invoke:
          name: prime
          payload: replay
      - repeat:
          name: observations
          count: $observation_count
          every_seconds: $interval_seconds
          node:
            invoke:
              name: warm
              payload: replay
    runner:
      label: residency-chain
      metadata: {purpose: cache-residency}
      benchmark:
        provider: aliyun
        model: deepseek-v4-pro
        tokenizer: {id: deepseek-ai/DeepSeek-V3, revision: main, use_fast: true}
        timeout_seconds: 60
        concurrent_requests: 1
        mean_input_tokens: 2048
        stddev_input_tokens: 0
        mean_output_tokens: 8
        stddev_output_tokens: 0
        additional_sampling_params:
          temperature: 0
          stream_options: {include_usage: true}
